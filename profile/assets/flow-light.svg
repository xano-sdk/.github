    <text x="389.3333333333333" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.4" fill="#4599FF" fill-opacity="1">02</text>
    <text x="389.3333333333333" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.4" fill="#0B0C10">Xano SDK</text>
    <text x="389.3333333333333" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B0C10" fill-opacity="0.85">TypeScript defines it</text>
    <text x="389.3333333333333" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#4B5468" fill-opacity="1">typed, reviewed in a PR</text>
  </g>
  <g>
    <rect x="666.6666666666666" y="64" width="248" height="152" rx="16" fill="#FFFFFF" stroke="#DDE3EE"/>
    <text x="690.6666666666666" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.4" fill="#4599FF" fill-opacity="1">03</text>
    <text x="690.6666666666666" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.4" fill="#0B0C10">Xano Engine</text>
    <text x="690.6666666666666" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B0C10" fill-opacity="0.85">Your machine runs it</text>
    <text x="690.6666666666666" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#4B5468" fill-opacity="1">no account, no network</text>
