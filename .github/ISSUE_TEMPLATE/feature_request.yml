name: Feature request
description: Suggest a capability or improvement for this module.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        The task, not the solution — what you were building when you hit the
        limit.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like this module to do?
      description: >-
        If you have a shape in mind, sketch it in TypeScript — that is the
        fastest way to agree on an API.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How are you handling it today?
      description: The workaround, if there is one, and where it falls short.
    validations:
      required: false
