  <path d="M952 134l7 6-7 6" stroke="#4599FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="640" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#8A93A6">One codebase from the first prompt to production. Every step is code you can read.</text>
