<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" fill="none">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1565FF"/><stop offset="1" stop-color="#4599FF"/></linearGradient>
    <style>
      .flow { animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="280" rx="20" fill="#F6F8FC"/>
  <rect x="0.5" y="0.5" width="1279" height="279" rx="19.5" stroke="#DDE3EE"/>
  
  <g>
    <rect x="64" y="64" width="248" height="152" rx="16" fill="#FFFFFF" stroke="#DDE3EE"/>
    <text x="88" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.4" fill="#4599FF" fill-opacity="1">01</text>
    <text x="88" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.4" fill="#0B0C10">Xano Studio</text>
    <text x="88" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B0C10" fill-opacity="0.85">Agents write it</text>
    <text x="88" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#4B5468" fill-opacity="1">Claude Code, Codex, …</text>
  </g>
