    <text x="992" y="104" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.4" fill="#FFFFFF" fill-opacity="0.85">04</text>
