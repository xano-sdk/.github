<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" fill="none">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1565FF"/><stop offset="1" stop-color="#4599FF"/></linearGradient>
    <linearGradient id="blueText" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1565FF"/><stop offset="1" stop-color="#4599FF"/></linearGradient>
    
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0B0C10" stroke-opacity="0.045" stroke-width="1"/>
  </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 220) rotate(90) scale(320 520)">
      <stop offset="0" stop-color="#1565FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1565FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F8FC" stop-opacity="0"/>
      <stop offset="1" stop-color="#F6F8FC" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="460" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="460" fill="#F6F8FC"/>
    <rect width="1280" height="460" fill="url(#grid)"/>
    <rect y="207" width="1280" height="253.00000000000003" fill="url(#fadeGrid)"/>
    <rect width="1280" height="460" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="459" rx="19.5" stroke="#DDE3EE"/>

  <g transform="translate(64 64) scale(0.44)">
  <path d="M0.010,15.510L29.298,15.510L64.700,48.383L64.604,51.567L30.601,84.490L0.000,84.490L36.622,50.003Z" fill="#0B0C10"/>
  <path d="M69.555,53.580L98.182,79.819L99.806,84.490L73.522,84.490L56.031,67.900L57.009,64.834Z" fill="url(#blue)"/>
  <path d="M74.391,15.510L100.000,15.510L97.932,20.805L69.255,47.365L54.904,33.298Z" fill="url(#blue)"/></g>
  <text x="118" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0B0C10" letter-spacing="-0.3">Xano SDK</text>

  <text x="64" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#0B0C10" letter-spacing="-1.6">AI builds software.</text>
  <text x="64" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#blueText)" letter-spacing="-1.6">Xano makes it trustworthy.</text>

  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#4B5468">
    <tspan x="64" y="300">Write your backend in TypeScript, or let an agent write it.</tspan>
    <tspan x="64" y="330">Run it on your machine, then ship it to Xano's cloud.</tspan>
  </text>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" letter-spacing="1.2">
    <rect x="64" y="368" width="108" height="34" rx="17" fill="#1565FF14" stroke="#1565FF" stroke-opacity="0.45"/>
    <text x="118" y="390" text-anchor="middle" fill="#4599FF">SDK</text>
    <rect x="184" y="368" width="128" height="34" rx="17" fill="#1565FF14" stroke="#1565FF" stroke-opacity="0.45"/>
    <text x="248" y="390" text-anchor="middle" fill="#4599FF">ENGINE</text>
    <rect x="324" y="368" width="128" height="34" rx="17" fill="#1565FF14" stroke="#1565FF" stroke-opacity="0.45"/>
    <text x="388" y="390" text-anchor="middle" fill="#4599FF">STUDIO</text>
    <rect x="464" y="368" width="128" height="34" rx="17" fill="#1565FF14" stroke="#1565FF" stroke-opacity="0.45"/>
    <text x="528" y="390" text-anchor="middle" fill="#4599FF">CLOUD</text>
  </g>

  <g>
    <rect x="772" y="84" width="444" height="300" rx="14" fill="#0E1015" stroke="#1F2430"/>
    <path d="M786 84h416a14 14 0 0 1 14 14v26h-444v-26a14 14 0 0 1 14 -14z" fill="#171A21"/>
    <circle cx="796" cy="104" r="6" fill="#FF5F57"/>
    <circle cx="816" cy="104" r="6" fill="#FEBC2E"/>
    <circle cx="836" cy="104" r="6" fill="#28C840"/>
    <text x="994" y="109" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5C6476">my-app</text>
    <text x="800" y="168" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15.5"><tspan fill="#5C6476">$ </tspan><tspan fill="#F4F6FA">npx @xano/sdk init my-app</tspan></text>
    <text x="800" y="194" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15.5"><tspan fill="#5C6476">$ </tspan><tspan fill="#F4F6FA">npm run xano:deploy</tspan></text>
    <text x="800" y="220" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15.5"><tspan fill="#9AA3B5">→ Deploying ./xano/index.ts → Xano Engine</tspan></text>
    <text x="800" y="246" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15.5"><tspan fill="#3DDC97">✓ </tspan><tspan fill="#F4F6FA">Xano Engine deployed</tspan></text>
    <text x="800" y="272" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15.5"><tspan fill="#9AA3B5">  http://127.0.0.1:53358</tspan></text>
    
    <text x="800" y="324" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15.5"><tspan fill="#5C6476">$ </tspan><tspan fill="#F4F6FA">npm run xano:deploy:ephemeral</tspan></text>
    <text x="800" y="350" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15.5"><tspan fill="#3DDC97">✓ </tspan><tspan fill="#F4F6FA">Live on Xano cloud</tspan></text>
    <rect x="800" y="360" width="10" height="20" fill="#4599FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
