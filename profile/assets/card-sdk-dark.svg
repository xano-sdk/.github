<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" fill="none">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1565FF"/><stop offset="1" stop-color="#4599FF"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 0) rotate(135) scale(340)">
      <stop offset="0" stop-color="#1565FF" stop-opacity="0.275"/>
      <stop offset="1" stop-color="#1565FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="640" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="640" height="320" fill="#13151B"/>
    <rect width="640" height="320" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="639" height="319" rx="17.5" stroke="#262A35"/>
  <g transform="translate(40 40)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="url(#blue)"/>
    <text x="28" y="37" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#FFFFFF">TS</text></g>
  
  <text x="40" y="128" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.6" fill="#4599FF">YOUR BACKEND, AS CODE</text>
  <text x="112" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.6" fill="#F4F6FA">Xano SDK</text>
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#9AA3B5"><tspan x="40" y="172">Tables, endpoints, functions, tasks and agents</tspan><tspan x="40" y="202">as typed TypeScript in your repo. Review it in</tspan><tspan x="40" y="232">a PR, deploy it with one command.</tspan></text>
  <path d="M40 246H600" stroke="#262A35"/>
  <text x="40" y="282" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#F4F6FA">$ npx @xano/sdk init my-app</text>
  <text x="600" y="282" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4599FF">View repo →</text>
</svg>
