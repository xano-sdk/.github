  <text x="112" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.6" fill="#F4F6FA">Xano Engine</text>
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#9AA3B5"><tspan x="40" y="172">The platform on your laptop. No account, no</tspan><tspan x="40" y="202">network, the same visual builder, and your</tspan><tspan x="40" y="232">data kept between deploys.</tspan></text>
